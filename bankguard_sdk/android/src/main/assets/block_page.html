<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked - BankGuard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Noto Sans,sans-serif;
      color:#0f172a;padding:20px;
    }
    .card{
      background:#ffffff;border:1.5px solid rgba(239,68,68,0.25);
      border-radius:20px;max-width:440px;width:100%;
      text-align:center;box-shadow:0 12px 36px rgba(15,23,42,0.08);
      overflow:hidden;display:flex;flex-direction:column;
    }
    .lang-row{
      display:flex;overflow-x:auto;gap:8px;padding:12px 16px;
      background:#f1f5f9;border-bottom:1px solid #e2e8f0;
      white-space:nowrap;-webkit-overflow-scrolling:touch;
      -ms-overflow-style:none;scrollbar-width:none;
    }
    .lang-row::-webkit-scrollbar {
      display:none;
    }
    .lang-chip{
      cursor:pointer;padding:6px 12px;border-radius:20px;font-size:.75rem;font-weight:600;
      border:1px solid #cbd5e1;color:#64748b;background:#ffffff;
      flex-shrink:0;transition:all 0.15s ease-in-out;
    }
    .lang-chip:hover{border-color:#fca5a5;color:#dc2626;}
    .lang-chip.active{
      background:#fee2e2;border-color:#ef4444;color:#b91c1c;
    }
    .card-content{
      padding:28px 24px;display:flex;flex-direction:column;align-items:center;
    }
    .shield-icon{
      width:64px;height:64px;border-radius:50%;background:#fee2e2;
      border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;
      margin-bottom:16px;font-size:32px;color:#dc2626;font-weight:bold;
    }
    .badge-row{
      display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:16px;
    }
    .badge{
      display:inline-block;background:#fee2e2;border:1px solid #fca5a5;
      color:#b91c1c;border-radius:8px;padding:5px 12px;font-size:.78rem;font-weight:600;
    }
    .speak-btn{
      background:#fee2e2;border:1px solid #fca5a5;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:#dc2626;padding:6px 10px;border-radius:8px;gap:5px;
      font-size:.78rem;font-weight:600;transition:all 0.15s ease-in-out;
    }
    .speak-btn:hover{background:#fecaca;}
    .speak-btn.speaking{background:#ef4444;color:#ffffff;border-color:#dc2626;}
    h1{font-size:1.35rem;font-weight:700;color:#991b1b;margin-bottom:12px;line-height:1.3}
    p{font-size:.88rem;line-height:1.6;color:#475569;margin-bottom:12px}
    .tip{
      background:#f8fafc;border-radius:10px;padding:12px 16px;
      font-size:.82rem;color:#334155;border-left:3px solid #3b82f6;text-align:left;
      width:100%;margin-bottom:16px;
    }
    .tip strong{color:#1e3a8a}
    .tip em{color:#0f172a;font-weight:600}
    .btn-row{
      display:flex;gap:12px;width:100%;margin-top:12px;
    }
    .action-btn{
      flex:1;cursor:pointer;padding:12px;border-radius:10px;font-size:.88rem;font-weight:600;
      border:none;transition:all 0.15s ease-in-out;
    }
    .btn-secondary{
      background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;
    }
    .btn-secondary:hover{background:#e2e8f0;}
    .btn-danger{
      background:#ef4444;color:#ffffff;
    }
    .btn-danger:hover{background:#dc2626;}
    footer{font-size:.72rem;color:#64748b;margin-top:16px}
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="lang-row" id="langRow"></div>

    <div class="card-content">
      <div class="shield-icon">!</div>

      <div class="badge-row">
        <span class="badge" id="badgeEl"></span>
        <button class="speak-btn" id="speakBtn" onclick="reSpeak()" aria-label="Listen warning">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="speakLabel">Listen</span>
        </button>
      </div>

      <h1 id="titleEl"></h1>
      <p id="line1El"></p>
      <p id="line2El"></p>

      <div class="tip">
        <strong id="safeAltEl"></strong><br />
        &bull; SBI YONO: <em>Play Store only</em><br />
        &bull; Internet banking: <em>onlinesbi.sbi.in</em><br />
        &bull; Customer care: <em>1800 1234</em>
      </div>

      <div class="btn-row">
        <button class="action-btn btn-secondary" onclick="goBack()" id="backBtnEl">Go Back</button>
      </div>

      <footer id="footerEl"></footer>
    </div>
  </div>

  <script>
    const STRINGS = {
      en: {
        badge: "BankGuard Intent Shield",
        title: "This Site Has Been Blocked",
        line1: "Our security engine detected that this domain matches a known phishing, scam, or social-engineering pattern targeting Indian banking customers.",
        line2: "The site has been blocked to protect your banking credentials and personal information.",
        safeAlt: "Safe alternatives:",
        footer: "Powered by BankGuard — SBI Security Suite",
        listen: "Listen",
        backBtn: "Go Back",
        ttsLang: "en-US",
      },
      hi: {
        badge: "बैंकगार्ड Intent शील्ड",
        title: "यह वेबसाइट ब्लॉक कर दी गई है",
        line1: "हमारे सुरक्षा इंजन ने पाया कि यह डोमेन फ़िशिंग, घोटाले या सोशल-इंजीनियरिंग पैटर्न से मेल खाता है।",
        line2: "आपके बैंकिंग क्रेडेंशियल और व्यक्तिगत जानकारी को सुरक्षित रखने के लिए इसे ब्लॉक किया गया है।",
        safeAlt: "सुरक्षित विकल्प:",
        footer: "बैंकगार्ड — एसबीआई सुरक्षा सूट",
        listen: "सुनें",
        backBtn: "वापस जाएं",
        ttsLang: "hi-IN",
      },
      mr: {
        badge: "बँकगार्ड Intent शील्ड",
        title: "ही वेबसाईट ब्लॉक करण्यात आली आहे",
        line1: "हा डोमेन फसवणूक किंवा सोशल-इंजिनिअरिंग पॅटर्नशी जुळतो असे आमच्या सुरक्षा प्रणालीने आढळले.",
        line2: "तुमच्या बँकिंग आणि वैयक्तिक माहितीच्या सुरक्षेसाठी ही साईट ब्लॉक केली आहे.",
        safeAlt: "सुरक्षित पर्याय:",
        footer: "बँकगार्ड — एसबीआय सिक्युरिटी सूट",
        listen: "ऐका",
        backBtn: "मागे जा",
        ttsLang: "mr-IN",
      },
      ta: {
        badge: "பேங்க்கார்டு Intent ஷீல்டு",
        title: "இந்த தளம் முடக்கப்பட்டுள்ளது",
        line1: "இந்த தளம் இந்திய வங்கி வாடிக்கையாளர்களை குறிவைக்கும் மோசடி அல்லது பிஷிங் முறைகளுடன் ஒத்துப்போவதாக பாதுகாப்பு அமைப்பு கண்டறிந்துளது.",
        line2: "உங்கள் வங்கி விவரங்கள் மற்றும் தனிப்பட்ட தகவல்களை பாதுகாக்க இந்த தளம் முடக்கப்பட்டுள்ளது.",
        safeAlt: "பாதுகாப்பான வழிகள்:",
        footer: "பேங்க்கார்டு — எஸ்பிআই பாதுகாப்பு சூட்",
        listen: "கேளுங்கள்",
        backBtn: "பின்செல்லவும்",
        ttsLang: "ta-IN",
      },
      te: {
        badge: "బ్యాంక్‌గార్డ్ Intent షీల్డ్",
        title: "ఈ వెబ్‌సైట్ బ్లాక్ చేయబడింది",
        line1: "ఈ డొమైన్ భారతీయ బ్యాంకింగ్ ఖాతాదారులను మోసం చేసేలా రూపొందించబడినట్లు మా భద్రతా వ్యవస్థ గుర్తించింది.",
        line2: "మీ వ్యక్తిగత మరియు బ్యాంకింగ్ భద్రత దృష్ట్యా ఈ సైట్ నిరోధించబడింది.",
        safeAlt: "సురక్షితమైన ప్రత్యామ్నాయాలు:",
        footer: "బ్యాంక్‌గార్డ్ — SBI సెక్యూరిట్రీ సూట్",
        listen: "వినండి",
        backBtn: "వెనుకకు వెళ్ళండి",
        ttsLang: "te-IN",
      },
      bn: {
        badge: "ব্যাংকগার্ড Intent শিল্ড",
        title: "এই সাইটটি ব্লক করা হয়েছে",
        line1: "আমাদের সিকিউরিটি সিস্টেম সনাক্ত করেছে যে এই ডোমেনটি ভারতীয় ব্যাংকিং গ্রাহকদের ফিশিং বা সোশ্যাল-ইঞ্জিনিয়ারিং পদ্ধতিতে লক্ষ্য করে।",
        line2: "আপনার ব্যাংকিং তথ্য এবং ব্যক্তিগত তথ্য সুরক্ষিত রাখতে এটি ব্লক করা করা হয়েছে।",
        safeAlt: "নিরাপদ বিকল্প:",
        footer: "ব্যাংকগার্ড — এসবিআই সিকিউরিটি স্যুট",
        listen: "শুনুন",
        backBtn: "ফিরে যান",
        ttsLang: "bn-IN",
      }
    };

    const LANG_LABELS = {
      en: "English",
      hi: "हिंदी",
      mr: "मराठी",
      ta: "தமிழ்",
      te: "తెలుగు",
      bn: "বাংলা",
    };
    const SUPPORTED = Object.keys(STRINGS);

    function detectLang() {
      const nav = (navigator.language || navigator.userLanguage || "en").split("-")[0].toLowerCase();
      return SUPPORTED.includes(nav) ? nav : "en";
    }

    let currentLang = detectLang();
    let isSpeaking = false;

    function render(lang) {
      currentLang = lang;
      const s = STRINGS[lang];
      document.documentElement.lang = lang;
      document.title = s.title + " — BankGuard";
      document.getElementById("badgeEl").textContent   = s.badge;
      document.getElementById("titleEl").textContent   = s.title;
      document.getElementById("line1El").textContent   = s.line1;
      document.getElementById("line2El").textContent   = s.line2;
      document.getElementById("safeAltEl").textContent = s.safeAlt;
      document.getElementById("footerEl").textContent  = s.footer;
      document.getElementById("speakLabel").textContent = s.listen;
      document.getElementById("backBtnEl").textContent  = s.backBtn;

      document.querySelectorAll(".lang-chip").forEach(c => {
        c.classList.toggle("active", c.dataset.lang === lang);
      });
    }

    function buildChips() {
      const row = document.getElementById("langRow");
      SUPPORTED.forEach(lk => {
        const chip = document.createElement("button");
        chip.className = "lang-chip";
        chip.dataset.lang = lk;
        chip.textContent = LANG_LABELS[lk];
        chip.onclick = () => {
          if (window.AndroidBridge && window.AndroidBridge.cancelSpeak) {
            try {
              window.AndroidBridge.cancelSpeak();
            } catch (e) {
              console.error("cancelSpeak failed: ", e);
            }
          }
          if (window.speechSynthesis) {
            try {
              window.speechSynthesis.cancel();
            } catch (_) {}
          }
          isSpeaking = false;
          setSpeakingState(false);
          render(lk);
          speak(lk);
        };
        row.appendChild(chip);
      });
    }

    function setSpeakingState(on) {
      const btn = document.getElementById("speakBtn");
      btn.classList.toggle("speaking", on);
    }

    function speak(lang) {
      const s = STRINGS[lang || currentLang];
      const textToSpeak = s.title + ". " + s.line1 + " " + s.line2;

      // Try Native Android TTS Engine first
      if (window.AndroidBridge && window.AndroidBridge.speakText) {
        try {
          window.AndroidBridge.speakText(textToSpeak, lang || currentLang);
          setSpeakingState(true);
          isSpeaking = true;
          return;
        } catch (e) {
          console.error("Native speak failed: ", e);
        }
      }

      // Web Speech API Fallback
      if (!window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(textToSpeak);
        utt.lang = s.ttsLang;
        utt.rate = 0.92;
        utt.onstart = () => setSpeakingState(true);
        utt.onend   = () => setSpeakingState(false);
        utt.onerror = () => setSpeakingState(false);
        window.speechSynthesis.speak(utt);
        isSpeaking = true;
      } catch (_) {}
    }

    function reSpeak() {
      speak(currentLang);
    }

    function goBack() {
      if (window.AndroidBridge && window.AndroidBridge.closePage) {
        try {
          window.AndroidBridge.closePage();
          return;
        } catch (e) {
          console.error("closePage failed: ", e);
        }
      }
      window.history.back();
    }

    buildChips();
    render(currentLang);

    try { speak(currentLang); } catch(_) {}

    const onInteraction = () => {
      if (!isSpeaking) speak(currentLang);
      ["click","touchstart","keydown"].forEach(e => document.removeEventListener(e, onInteraction));
    };
    ["click","touchstart","keydown"].forEach(e => document.addEventListener(e, onInteraction));
  </script>
</body>
</html>
